services:

  redis:
    image: redis
    container_name: redis
    restart: on-failure
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    env_file:
      - ./.env

  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env

  celery:
    build: .
    command: >
      bash -c "celery -A config worker --loglevel=info --pool=solo"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis
      - db

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - .nginx/nginx.conf:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput \
             && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

volumes:
  postgres_data:
  static_volume:
  redis_data:
