name: Django CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  DJANGO_SETTINGS_MODULE: config.settings
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install

      - name: Run migrations
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t \
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}" << 'EOF'
            echo "📦 Pull latest image..."
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}

            echo "🧹 Останавливаем старый контейнер (если есть)..."
            docker stop my_app || true

            echo "⌛ Ждём удаления контейнера my_app..."
            while docker ps -a --format '{{.Names}}' | grep -q '^my_app$'; do
              docker rm my_app || true
              sleep 1
            done

            echo "🔍 Проверяем, кто слушает порт 80 в Docker..."
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}' | grep ':80' || echo "Нет контейнеров с портом 80"

            echo "🛑 Удаляем все контейнеры с publish=80..."
            for id in $(docker ps -q --filter "publish=80"); do
              echo "Удаляем контейнер $id с портом 80..."
              docker stop "$id" || true
              docker rm "$id" || true
              sleep 1
            done

            echo "🧠 Проверка, кто СЛУШАЕТ порт 80 (LISTEN)..."
            sudo lsof -nP -iTCP:80 -sTCP:LISTEN || true

            echo "🔪 Завершаем процессы, слушающие порт 80..."
            for pid in $(sudo lsof -nP -iTCP:80 -sTCP:LISTEN -t || true); do
              echo "Kill PID $pid"
              sudo kill -9 "$pid"
              sleep 1
            done

            echo "⌛ Ждём, пока порт 80 освободится..."
            while sudo lsof -nP -iTCP:80 -sTCP:LISTEN > /dev/null; do
              sleep 1
            done

            echo "✅ Порт 80 свободен. Проверка контейнера my_app..."

            # Удаляем контейнер my_app, если остался по имени
            if docker ps -a --format '{{.Names}}' | grep -q '^my_app$'; then
              echo "Удаляем старый контейнер my_app (остаток)..."
              docker rm -f my_app || true
            fi

            echo "🚀 Запуск нового контейнера..."
            docker run -d --name my_app -p 80:8000 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/my_app:${{ github.sha }}
          EOF
